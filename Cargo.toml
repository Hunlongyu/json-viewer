[workspace]
members = ["crates/reader", "crates/viewer", "crates/measure"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
strip = "symbols"
lto = "thin"
opt-level = "s"
codegen-units = 1

[profile.dev]
debug = 0

# NSH #898 makes the large native runtime features optional. Keep the
# comparison workspace on its original released SDK and benchmark profile.
[patch.crates-io]
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "927f5cdd9cdb574767a0ce32b47b5405a42b7865" }
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "927f5cdd9cdb574767a0ce32b47b5405a42b7865" }
