[package]
name = "preview-host-comparison"
version = "0.1.0"
edition = "2024"
publish = false

# Keep the comparison SDKs out of the production viewer's dependency graph.
[workspace]

[profile.release]
strip = "symbols"

[dependencies]
json-preview = { path = "../crates/viewer", default-features = false }
nsh-platform-gpui = { version = "=0.4.0", default-features = false }
# NSH 0.4 uses the dynamic KeyBinding constructor from its upstream 0.1.9 lock.
gpui-fast = "=0.1.9"
gpui-fast-platform = "=0.1.9"
gpui-kit = { version = "=0.7.3", features = ["gpui-fast"], optional = true }

[features]
kit = ["dep:gpui-kit"]

[[bin]]
name = "json-preview-gpui-kit"
path = "src/bin/kit.rs"
required-features = ["kit"]

[[bin]]
name = "json-preview-gpui"
path = "src/bin/gpui.rs"
