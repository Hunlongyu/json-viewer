[package]
name = "json-preview"
version.workspace = true
edition.workspace = true

[features]
default = ["win32"]
win32 = ["dep:nsh-platform-windows"]

[[bin]]
name = "json-preview"
path = "src/main.rs"
required-features = ["win32"]

[dependencies]
preview-reader = { path = "../reader" }
nsh-core = "=0.4.0"
nsh-platform-windows = { version = "=0.4.0", default-features = false, optional = true }
async-channel = "2"
memchr = "2"
